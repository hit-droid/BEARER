# 关闭 AndroidX 旧包名兼容，统一使用 AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin / JVM
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 关闭 Gradle 配置缓存报错（部分 Kotlin 插件版本仍不完全兼容）
org.gradle.configuration-cache=false

# 是否构建原生推理层（llama.cpp JNI）。默认 false → 工程无需 NDK 即可编译运行（走 StubEngine 规则规划器）。
# 接入真实端侧 LLM 时改为 true（或命令行 -Pofflineagent.native=true），并先执行 scripts/build_llama.sh。
offlineagent.native=false
